# Overrides mysql.properties for an unattended run.
#
# The upstream project ships mysql.properties with placeholder credentials and
# expects whoever runs the suite to point it at a MySQL server of their own
# (README, "Step 2: Create table WORKER_NODE"). Spring merges every
# uid/*.properties file in name order, later files winning, so this one selects
# the serverless driver instead. Delete it to run the suite against the MySQL
# server configured in mysql.properties.
mysql.driver=org.sqlite.JDBC
jdbc.url=jdbc:sqlite::memory:
jdbc.username=
jdbc.password=
